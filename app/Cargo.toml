[package]
description            = "A live-preview markdown editor"
edition.workspace      = true
license.workspace      = true
name                   = "livemark-app"
publish                = false
rust-version.workspace = true
version.workspace      = true

[[bin]]
# Its docs would collide with the library's, which share the name.
doc  = false
name = "livemark"
path = "src/main.rs"

[dependencies]
# Where the settings file lives on each platform.
dirs             = "7"
iced             = { workspace = true }
# Today's date in the system's time zone, for new notes.
jiff             = "0.2"
livemark         = { path = ".." }
# Links from one note to another, `../` where needed.
pathdiff         = "0.2"
# `%20` and the like in link and picture paths (already in the tree).
percent-encoding = "2"
# Open and save dialogs (XDG portal on Linux).
rfd              = "0.17"
# The settings file, read and written as TOML.
serde            = { version = "1", features = ["derive"] }
toml             = "1"
# File names from titles in any script.
slug             = "0.1"
# Typo distances in title search and tag look-alikes.
strsim           = "0.11"
# The vault's folders, symbolic links followed (already in the tree).
walkdir          = "2"
