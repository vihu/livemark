[package]
description            = "Live-preview markdown editor for iced"
edition.workspace      = true
license.workspace      = true
name                   = "livemark"
publish                = false
rust-version.workspace = true
version.workspace      = true

[workspace]
members = ["app"]

[workspace.package]
edition      = "2024"
license      = "MIT"
rust-version = "1.93"
version      = "0.2.0"

[workspace.dependencies]
# Pinned iced master, the same rev as roughdraft: a host shows both editors,
# and two revs cannot share `Element`s. Bump both repos together, at
# milestone boundaries.
iced = { git = "https://github.com/iced-rs/iced", rev = "90dec30cc7368c3fbaac69790e43a4b08a21691d", features = ["advanced", "canvas", "highlighter", "image"] }

[dependencies]
iced           = { workspace = true }
# CommonMark 0.31.2 with GFM tables, strikethrough and task lists; chosen in
# L0 (PLAN-001 decisions log).
pulldown-cmark = { version = "0.13.4", default-features = false }
# Grapheme steps for the caret (already in the tree through cosmic-text).
unicode-segmentation = "1"
# Decoding pictures for `![alt](url)` (REFERENCE-001 section 5): the same
# version and formats as roughdraft, so a host with both builds it once.
image          = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }

[dev-dependencies]
# Headless rendering for widget tests and the snapshot example; same rev as iced.
iced_test = { git = "https://github.com/iced-rs/iced", rev = "90dec30cc7368c3fbaac69790e43a4b08a21691d" }
# iced's frame loop (`UserInterface`) for the bench example; already in the tree.
iced_runtime = { git = "https://github.com/iced-rs/iced", rev = "90dec30cc7368c3fbaac69790e43a4b08a21691d" }
# HTML output for the spec conformance tests only.
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
