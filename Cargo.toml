[package]
description            = "Live-preview markdown editor for iced"
edition.workspace      = true
license.workspace      = true
name                   = "livemark"
publish                = false
rust-version.workspace = true
version.workspace      = true

[workspace]
members = ["app"]

[workspace.package]
edition      = "2024"
license      = "MIT"
rust-version = "1.93"
version      = "0.1.0"

[workspace.dependencies]
# Pinned iced master, the same rev as roughdraft: a host shows both editors,
# and two revs cannot share `Element`s. Bump both repos together, at
# milestone boundaries.
iced = { git = "https://github.com/iced-rs/iced", rev = "90dec30cc7368c3fbaac69790e43a4b08a21691d", features = ["advanced"] }

[dependencies]
# CommonMark 0.31.2 with GFM tables, strikethrough and task lists; chosen in
# L0 (PLAN-001 decisions log).
pulldown-cmark = { version = "0.13.4", default-features = false }

[dev-dependencies]
# HTML output for the spec conformance tests only.
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
